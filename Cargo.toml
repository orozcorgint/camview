[workspace]
resolver = "3"

[package]
name = "camview"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Lightweight RTSP camera viewer and recorder for low-power Linux desktops"
license = "MIT"
authors = ["orozcorgint"]
repository = "https://github.com/orozcorgint/camview"
homepage = "https://github.com/orozcorgint/camview"
readme = "README.md"
keywords = ["rtsp", "camera", "security", "linux", "mpv"]
categories = ["multimedia::video", "gui"]

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = "=0.32.3"
libmpv2 = "=7.0.1"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
url = "=2.5.8"
percent-encoding = "2"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
raw-window-handle = "0.6"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = "symbols"
panic = "abort"
