name: Package

on:
  pull_request:
    paths:
      - "packaging/**"
      - "data/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/package.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    name: Build Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libmpv-dev libssl-dev dpkg-dev \
            desktop-file-utils appstream groff shellcheck \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Lint packaging scripts
        run: >-
          shellcheck packaging/build-deb.sh
          packaging/deb/postinst packaging/deb/postrm

      - name: Build package
        run: ./packaging/build-deb.sh

      - name: Inspect package
        run: |
          dpkg-deb --info dist/camview_*.deb
          dpkg-deb --contents dist/camview_*.deb

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: camview-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Attach package to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.deb --clobber
